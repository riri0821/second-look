services:
  - type: web
    name: second-look-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # Render sits in front of the server; trust only the address its proxy adds.
      - key: TRUST_PROXY
        value: "1"
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: VIRUSTOTAL_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      # Database for scam reports and feedback (Supabase connection string, app user)
      - key: DATABASE_URL
        sync: false
      # Long random secret for the one-way reporter code
      - key: REPORT_SECRET
        sync: false
