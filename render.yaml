services:
  - type: web
    name: second-look-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: VIRUSTOTAL_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
